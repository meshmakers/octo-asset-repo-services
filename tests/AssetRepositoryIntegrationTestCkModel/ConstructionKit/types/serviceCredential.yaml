$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: ServiceCredential
  derivedFromCkTypeId: ${System}/Entity
  description: "A configuration entity with Secret attributes (AB#5528)"
  attributes:
    - id: ${this}/ServiceCredentialName
      name: Name
    # Required secret
    - id: ${this}/ServiceCredentialPassword
      name: Password
    # Optional secret
    - id: ${this}/ServiceCredentialApiKey
      name: ApiKey
      isOptional: true
    # RecordArray with a Secret sub-attribute (keyed carry-over)
    - id: ${this}/ServiceCredentialEndpoints
      name: Endpoints
      isOptional: true
    # Single record with a Secret sub-attribute (positional carry-over)
    - id: ${this}/ServiceCredentialPrimaryEndpoint
      name: PrimaryEndpoint
      isOptional: true
