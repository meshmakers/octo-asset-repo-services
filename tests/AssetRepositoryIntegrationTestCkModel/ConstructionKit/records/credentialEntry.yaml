$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
records:
# AB#5528: a record with a Secret sub-attribute must declare a record key (compiler message 76);
# the key is how the engine carries a secret over when the record array is written as a whole.
- recordId: CredentialEntry
  description: "Endpoint credential entry for SECRET-in-record testing"
  recordKey: Key
  attributes:
    - id: ${this}/CredentialEntryKey
      name: Key
    - id: ${this}/CredentialEntryToken
      name: Token
      isOptional: true
    - id: ${this}/CredentialEntryLabel
      name: Label
      isOptional: true
