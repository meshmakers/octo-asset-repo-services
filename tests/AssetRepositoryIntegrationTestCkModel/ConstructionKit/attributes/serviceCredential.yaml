$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
  - id: ServiceCredentialName
    valueType: String
  - id: ServiceCredentialPassword
    valueType: Secret
    description: "Required secret"
  - id: ServiceCredentialApiKey
    valueType: Secret
    description: "Optional secret"
  - id: ServiceCredentialEndpoints
    valueType: RecordArray
    valueCkRecordId: ${this}/CredentialEntry
  - id: ServiceCredentialPrimaryEndpoint
    valueType: Record
    valueCkRecordId: ${this}/CredentialEntry
  - id: CredentialEntryKey
    valueType: String
  - id: CredentialEntryToken
    valueType: Secret
  - id: CredentialEntryLabel
    valueType: String
