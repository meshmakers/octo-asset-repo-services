$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
interfaces:
  - interfaceId: Labeled-1
    description: "CK v2 Phase 0 test interface (AB#5667): anything with a name and an optional label."
    attributes:
      - id: ${System}/Name
        name: Name
      - id: ${this}/AccessTestLabel
        name: Label
        isOptional: true
  - interfaceId: Member-1
    description: "CK v2 Phase 1 test interface (F1.5-S2, AB#5921): extends Labeled-1 and adds an association member."
    extends:
      - ${this}/Labeled-1
    associations:
      - id: ${this}/AccessTestMembership
        targetCkTypeId: ${this}/AccessTestGroup
  - interfaceId: Labeled-2
    description: "CK v2 Phase 1 test interface (F1.5-S2): the next contract version coexists with Labeled-1."
    attributes:
      - id: ${System}/Name
        name: Name
